<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%" role="img" aria-label="Kiến trúc 3 lớp và bảo mật Full-Stack của Cò Em">
  <defs>
    <linearGradient id="archBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071915" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b" />
      <feMerge>
        <feMergeNode in="b" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="280" rx="18" fill="url(#archBg)" stroke="#334155" stroke-width="1.2" />

  <!-- Tiêu đề sơ đồ -->
  <text x="36" y="36" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#fcd34d" letter-spacing="1.2">
    KIẾN TRÚC PHÂN TẦNG 3 LỚP &amp; BẢO MẬT FULL-STACK
  </text>

  <!-- Đường nối động giữa 3 khối -->
  <path id="flow12" d="M362,148 L428,148" stroke="#34d399" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite" />
  </path>
  <path id="flow23" d="M772,148 L838,148" stroke="#fbbf24" stroke-width="2.5" stroke-dasharray="6 6">
    <animate attributeName="stroke-dashoffset" from="24" to="0" dur="1.4s" repeatCount="indefinite" />
  </path>

  <!-- Hạt dữ liệu di chuyển -->
  <circle r="4.5" fill="#6ee7b7" filter="url(#softGlow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M362,148 L428,148" />
  </circle>
  <circle r="4.5" fill="#fde68a" filter="url(#softGlow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M772,148 L838,148" />
  </circle>

  <!-- LỚP 1 -->
  <g transform="translate(36, 62)">
    <rect width="326" height="176" rx="14" fill="#064e3b" fill-opacity="0.35" stroke="#10b981" stroke-width="1.5" />
    <rect x="16" y="16" width="112" height="24" rx="8" fill="#10b981" fill-opacity="0.22" />
    <text x="26" y="32" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#6ee7b7">LỚP 1 · DỮ LIỆU</text>
    <text x="16" y="64" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">Tư Liệu Văn Hóa Gốc</text>
    <text x="16" y="88" font-family="system-ui, sans-serif" font-size="12.5" fill="#d1fae5">• 72 trang phục · 23 nhóm · 16 phụ kiện</text>
    <text x="16" y="110" font-family="system-ui, sans-serif" font-size="12.5" fill="#d1fae5">• 54 dân tộc · 34 tỉnh thành · 6 lễ hội</text>
    <text x="16" y="132" font-family="system-ui, sans-serif" font-size="12.5" fill="#d1fae5">• 7 nguồn khảo cứu đối chiếu thực tế</text>
    <text x="16" y="158" font-family="monospace" font-size="11.5" fill="#6ee7b7">src/data/* · Offline-ready 0ms</text>
  </g>

  <!-- LỚP 2 -->
  <g transform="translate(432, 62)">
    <rect width="336" height="176" rx="14" fill="#78350f" fill-opacity="0.28" stroke="#f59e0b" stroke-width="1.5" />
    <rect x="16" y="16" width="132" height="24" rx="8" fill="#f59e0b" fill-opacity="0.22" />
    <text x="26" y="32" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#fde68a">LỚP 2 · LOGIC CHUẨN</text>
    <text x="16" y="64" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">Bộ Luật &amp; Render Vector</text>
    <text x="16" y="88" font-family="system-ui, sans-serif" font-size="12.5" fill="#fef3c7">• Phán quyết Chuẩn / Sáng tạo / Lưu ý</text>
    <text x="16" y="110" font-family="system-ui, sans-serif" font-size="12.5" fill="#fef3c7">• Ma-nơ-canh 2D croquis &amp; bóc tách 3D</text>
    <text x="16" y="132" font-family="system-ui, sans-serif" font-size="12.5" fill="#fef3c7">• Âm thanh dân gian Web Audio API</text>
    <text x="16" y="158" font-family="monospace" font-size="11.5" fill="#fde68a">src/lib/rules.ts · src/characters/*</text>
  </g>

  <!-- LỚP 3 -->
  <g transform="translate(838, 62)">
    <rect width="326" height="176" rx="14" fill="#1e1b4b" fill-opacity="0.4" stroke="#818cf8" stroke-width="1.5" />
    <rect x="16" y="16" width="154" height="24" rx="8" fill="#6366f1" fill-opacity="0.25" />
    <text x="26" y="32" font-family="system-ui, sans-serif" font-size="11.5" font-weight="800" fill="#c7d2fe">LỚP 3 · SERVER &amp; AI</text>
    <text x="16" y="64" font-family="Georgia, serif" font-size="18" font-weight="700" fill="#ffffff">Express Proxy &amp; Firebase</text>
    <text x="16" y="88" font-family="system-ui, sans-serif" font-size="12.5" fill="#e0e7ff">• Gemini Vision, Maps &amp; Lyria Music</text>
    <text x="16" y="110" font-family="system-ui, sans-serif" font-size="12.5" fill="#e0e7ff">• OTP Auth, Admin SHA-256 &amp; Firestore</text>
    <text x="16" y="132" font-family="system-ui, sans-serif" font-size="12.5" fill="#e0e7ff">• SQLite/JSON isolation &amp; Rate Limit</text>
    <text x="16" y="158" font-family="monospace" font-size="11.5" fill="#a5b4fc">server/routes/* · src/lib/firebase.ts</text>
  </g>
</svg>
